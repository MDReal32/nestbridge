name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Derive Nx base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Lint affected
        run: yarn nx affected -t lint

      - name: Typecheck affected
        run: yarn nx affected -t typecheck

      - name: Test affected
        run: yarn nx affected -t test

      - name: Build affected
        run: yarn nx affected -t build
