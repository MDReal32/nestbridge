name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for pending changesets
        id: status
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.status.outputs.has-changesets == 'true'
        run: |
          set -euo pipefail
          yarn run version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build publishable packages (lint, typecheck, test, build)
        run: yarn nx run-many -t build --projects=core,runtime,vite,nestbridge

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          declare -A expected=(
            [packages/core]="build/nestbridge.core.js build/nestbridge.core.d.ts"
            [packages/runtime]="build/nestbridge.runtime.js build/nestbridge.runtime.d.ts"
            [packages/vite]="build/nestbridge.vite.js build/nestbridge.vite.d.ts"
            [packages/nestbridge]="build/index.js build/index.d.ts build/vite.js build/vite.d.ts"
          )
          for dir in "${!expected[@]}"; do
            for file in ${expected[$dir]}; do
              if [ ! -f "$dir/$file" ]; then
                echo "::error::Missing expected build artifact: $dir/$file"
                exit 1
              fi
            done
            echo "Verified artifacts in $dir"
          done

      - name: Publish packages to npm
        run: |
          set -euo pipefail
          for dir in packages/core packages/runtime packages/vite packages/nestbridge; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            echo "Publishing $name@$version"
            (cd "$dir" && npm publish --access public --provenance)
            git tag "$name@$version"
            git push origin "$name@$version"
            GH_TOKEN=${{ github.token }} gh release create "$name@$version" --title "$name@$version" --generate-notes
          done
