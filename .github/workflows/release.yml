name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  release:
    name: Version packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for pending changesets
        id: status
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.status.outputs.has-changesets == 'true'
        run: |
          set -euo pipefail
          yarn run version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: Build ${{ matrix.project }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: core
            dir: packages/core
            expected: build/nestbridge.core.js build/nestbridge.core.d.ts
          - project: runtime
            dir: packages/runtime
            expected: build/nestbridge.runtime.js build/nestbridge.runtime.d.ts
          - project: unplugin
            dir: packages/unplugin
            expected: build/nestbridge.unplugin.js build/nestbridge.unplugin.d.ts
          - project: vite
            dir: packages/vite
            expected: build/nestbridge.vite.js build/nestbridge.vite.d.ts
          - project: webpack
            dir: packages/webpack
            expected: build/nestbridge.webpack.js build/nestbridge.webpack.d.ts
          - project: nestbridge
            dir: packages/nestbridge
            expected: build/index.js build/index.d.ts build/vite.js build/vite.d.ts build/webpack.js build/webpack.d.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build ${{ matrix.project }}
        run: yarn nx run-many -t build --projects=${{ matrix.project }}

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          for file in ${{ matrix.expected }}; do
            if [ ! -f "${{ matrix.dir }}/$file" ]; then
              echo "::error::Missing expected build artifact: ${{ matrix.dir }}/$file"
              exit 1
            fi
          done
          echo "Verified artifacts in ${{ matrix.dir }}"

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.project }}
          retention-days: 1
          path: ${{ matrix.dir }}/build

  publish:
    name: Publish ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: core
            dir: packages/core
          - project: runtime
            dir: packages/runtime
          - project: unplugin
            dir: packages/unplugin
          - project: vite
            dir: packages/vite
          - project: webpack
            dir: packages/webpack
          - project: nestbridge
            dir: packages/nestbridge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@v6
        with:
          name: build-${{ matrix.project }}
          path: ${{ matrix.dir }}/build

      - name: Publish to npm
        run: |
          set -euo pipefail
          name=$(node -p "require('./${{ matrix.dir }}/package.json').name")
          version=$(node -p "require('./${{ matrix.dir }}/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
            exit 0
          fi
          echo "Publishing $name@$version"
          (cd "${{ matrix.dir }}" && npm publish --access public --provenance)
          git tag "$name@$version"
          git push origin "$name@$version"
          GH_TOKEN=${{ github.token }} gh release create "$name@$version" --title "$name@$version" --generate-notes
